# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

vars:
  OLS_DIR: third_party/ols
  OLS_REPO: https://github.com/DanielGavin/ols.git

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all

  check:
    desc: Type-check every package (no codegen)
    cmds:
      - odin check buffer -no-entry-point
      - odin check keymap -no-entry-point
      - odin check syntax -no-entry-point
      - odin check lsp -no-entry-point
      - odin check editor -no-entry-point
      - odin check example

  test:
    desc: Run unit tests for every package
    cmds:
      - odin test buffer -define:ODIN_TEST_THREADS=1
      - odin test keymap -define:ODIN_TEST_THREADS=1
      - odin test syntax -define:ODIN_TEST_THREADS=1
      - odin test lsp -define:ODIN_TEST_THREADS=1
      - odin test editor -define:ODIN_TEST_THREADS=1

  test:buffer:
    desc: Run unit tests for the buffer package only
    cmds:
      - odin test buffer -define:ODIN_TEST_THREADS=1

  test:keymap:
    desc: Run unit tests for the keymap package only
    cmds:
      - odin test keymap -define:ODIN_TEST_THREADS=1

  test:syntax:
    desc: Run unit tests for the syntax package only
    cmds:
      - odin test syntax -define:ODIN_TEST_THREADS=1

  test:lsp:
    desc: Run unit tests for the lsp package only
    cmds:
      - odin test lsp -define:ODIN_TEST_THREADS=1

  test:editor:
    desc: Run unit tests for the editor package only
    cmds:
      - odin test editor -define:ODIN_TEST_THREADS=1

  build:
    desc: Build the standalone demo application
    cmds:
      - odin build example -out:example/editor_demo

  run:
    desc: Build & run the standalone demo application
    cmds:
      - odin run example -out:example/editor_demo

  fmt:
    desc: Format all Odin source files in this folder
    cmds:
      - odinfmt -w buffer keymap syntax lsp editor example
    ignore_error: true

  ols:fetch:
    desc: Clone or update the OLS (Odin Language Server) source
    cmds:
      - |
        if [ -d "{{.OLS_DIR}}/.git" ]; then
          git -C {{.OLS_DIR}} pull --ff-only
        else
          git clone {{.OLS_REPO}} {{.OLS_DIR}}
        fi

  ols:build:
    desc: Build the OLS binary from the vendored source
    deps: [ols:fetch]
    cmds:
      - cd {{.OLS_DIR}} && ./build.sh || odin build src -out:ols

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f example/editor_demo
      - rm -rf example/editor_demo.dSYM
