<?xml version="1.0" encoding="UTF-8"?>
<!-- Shape tween / trim path fixture: a circle and a star with different
     colours (one with a gradient, one with an outline) to morph between,
     and an open stroked squiggle to trim. -->
<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd23f"/><stop offset="1" stop-color="#ee4266"/>
    </linearGradient>
  </defs>
  <g id="circle">
    <circle cx="70" cy="70" r="55" fill="#3bceac"/>
  </g>
  <g id="star">
    <polygon points="70,10 86,52 130,52 94,78 108,122 70,96 32,122 46,78 10,52 54,52" fill="#540d6e" stroke="#ffd23f" stroke-width="6" stroke-linejoin="round"/>
  </g>
  <g id="squiggle">
    <path d="M160 160 C180 100 200 220 220 160 S260 100 280 160" fill="none" stroke="#ee4266" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g id="badge">
    <rect x="160" y="20" width="120" height="80" rx="20" fill="url(#g1)"/>
  </g>
</svg>
