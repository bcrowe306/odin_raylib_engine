# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  GREETING: Hello, world!

tasks:
    run:
        desc: Run the game engine application
        cmds:
            - odin run .
    editor:
        desc: Run the standalone Dear ImGui Game Engine Editor
        cmds:
            - odin run editor
    editor:build:
        desc: Build the standalone Game Engine Editor binary
        cmds:
            - mkdir -p bin
            - odin build editor -out:bin/editor
    editor:check:
        desc: Run type-checking on editor package
        cmds:
            - odin check editor
    editor:e2e:
        desc: Run the editor UI test-drives (alias of editor:drive)
        cmds:
            - task: editor:drive
    editor:drive:
        desc: Editor UI test-drives in the background (hidden windows, JOBS in parallel; SUITE="a b" for some, VISIBLE=1 to watch)
        cmds:
            - ./scripts/editor_drive.sh {{.SUITE}}
    editor:package:
        desc: Package the editor as an installed app in dist/ (macOS .app, Linux / Windows folder); VERSION=1.2.3
        cmds:
            - ./scripts/package_editor.sh --out dist --version {{.VERSION | default "0.0.0-dev"}}
    editor:package:test:
        desc: Smoke-test the packaged editor in dist/ from outside the checkout (Play, export, the language server)
        cmds:
            - ./scripts/test_package.sh dist
    game:build:
        desc: Build the game runner the editor launches on Play
        cmds:
            - mkdir -p bin
            - odin build . -out:bin/odin_raylib_engine
    bench:
        desc: Performance benchmarks (engine, uncapped rendering, editor frame phases); PARTS="engine rendering editor" picks some
        cmds:
            - ./scripts/bench.sh {{.PARTS}}
    test:
        desc: Run all tests (engine lifecycle, UI unit tests, and UI showcase E2E automation)
        cmds:
            - odin test engine -define:ODIN_TEST_THREADS=1
            - odin test ui -define:ODIN_TEST_THREADS=1
            - cd ui && ./scripts/test_showcase.sh
    test:engine:
        desc: Run engine package unit & memory leak tests
        cmds:
            - odin test engine -define:ODIN_TEST_THREADS=1
    test:ui:
        desc: Run standalone ui package unit tests
        cmds:
            - odin test ui -define:ODIN_TEST_THREADS=1
    ui:e2e:
        desc: Run automated UI showcase test with event injection & screenshot capture
        cmds:
            - cd ui && ./scripts/test_showcase.sh
    ui:showcase:
        desc: Launch interactive standalone UI showcase app
        cmds:
            - cd ui && odin run .
    check:
        desc: Run type-checking on all packages (root, ui, editor), unit tests, and editor E2E
        cmds:
            - odin check .
            - odin check ui
            - odin check editor
            - odin test engine -define:ODIN_TEST_THREADS=1
            - odin test ui -define:ODIN_TEST_THREADS=1
            - task: editor:e2e
