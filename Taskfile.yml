# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  GREETING: Hello, world!

# The editor's own tasks (editor/Taskfile.yml) as editor:build, editor:run,
# editor:check, editor:drive, editor:package, ...
includes:
  editor:
    taskfile: ./editor/Taskfile.yml
    dir: ./editor # (its tasks' `dir: ..` is then the repo root)

tasks:
    run:
        desc: Run the game engine application
        cmds:
            - odin run .
    editor:
        desc: Run the standalone Dear ImGui Game Engine Editor
        cmds:
            - odin run editor
    editor:e2e:
        desc: Run the editor UI test-drives (alias of editor:drive)
        cmds:
            - task: editor:drive
    game:build:
        desc: Build the game runner the editor launches on Play
        cmds:
            - mkdir -p bin
            - odin build . -out:bin/rayzr
    bench:
        desc: Performance benchmarks (engine, uncapped rendering, editor frame phases); PARTS="engine rendering editor" picks some
        cmds:
            - ./scripts/bench.sh {{.PARTS}}
    test:
        desc: Run all tests (engine lifecycle, UI unit tests, and UI showcase E2E automation)
        cmds:
            - odin test engine -define:ODIN_TEST_THREADS=1
            - odin test ui -define:ODIN_TEST_THREADS=1
            - cd ui && ./scripts/test_showcase.sh
    test:engine:
        desc: Run engine package unit & memory leak tests
        cmds:
            - odin test engine -define:ODIN_TEST_THREADS=1
    test:ui:
        desc: Run standalone ui package unit tests
        cmds:
            - odin test ui -define:ODIN_TEST_THREADS=1
    ui:e2e:
        desc: Run automated UI showcase test with event injection & screenshot capture
        cmds:
            - cd ui && ./scripts/test_showcase.sh
    ui:showcase:
        desc: Launch interactive standalone UI showcase app
        cmds:
            - cd ui && odin run .
    check:
        desc: Run type-checking on all packages (root, ui, editor), unit tests, and editor E2E
        cmds:
            - odin check .
            - odin check ui
            - odin check editor
            - odin test engine -define:ODIN_TEST_THREADS=1
            - odin test ui -define:ODIN_TEST_THREADS=1
            - task: editor:e2e
    docs:nodes:
        desc: Regenerate the node reference (docs/generated/nodes.json) from the editor
        cmds:
            - mkdir -p bin
            - odin build editor -out:bin/editor
            - bin/editor --dump-docs docs/generated/nodes.json
    docs:check:
        desc: Check the docs are complete and in step with the code (CI runs it)
        cmds:
            - python3 scripts/docs/check_docs.py --editor bin/editor
            - python3 scripts/docs/test_export_site.py
            - python3 scripts/ci/test_publish_r2.py
    docs:export:
        desc: Export this checkout's docs as the website's bundle (build/docs_bundle)
        cmds:
            - python3 scripts/docs/export_site.py --out build/docs_bundle
    docs:shots:
        desc: Refresh the docs' annotated screenshots (docs_*.drive; needs a display)
        cmds:
            - scripts/docs/screenshots.sh
    docs:site:
        desc: "Preview rayzr.app with this checkout's docs (needs ../rayzr_website: github.com/bcrowe306/rayzr_website)"
        dir: ../rayzr_website
        cmds:
            - ENGINE_DIR={{.ROOT_DIR}} npm run sync
            - npm run dev
