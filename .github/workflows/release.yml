# Publishes a GitHub Release with every platform's build:
#   - a dev build for every push to main that passes CI (every merged
#     feature / fix): v<VERSION>-dev.<n>, n = main's commit count, a
#     pre-release tagged on that commit (VERSION: the next release);
#   - a release when a version tag is pushed (v1.2.3, v0.4.0-beta.1) - then
#     bump VERSION so the dev builds after it sort above it.
# Each one builds:
#   1. the runners on each platform (macOS, Linux, Windows) and the web runner;
#   2. the editor packaged on each platform with every platform's runners in
#      it (any editor exports every desktop target and the web);
#   3. a GitHub Release with the packages and their SHA-256 checksums
#      (a pre-release when the version has a suffix, e.g. -beta.1).
# Signing: macOS packages are ad-hoc signed unless the MACOS_* secrets are
# set (Developer ID + notarization: TODO C.4); Windows ones are unsigned
# (TODO C.5).
name: Release

on:
  # A dev build: CI passed on a push to main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
    # A dry run: everything but the GitHub Release (push to this branch).
    branches: [release-dryrun]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no tag, no release: a dry run)"
        required: true
        default: "0.0.0-dryrun"

permissions:
  contents: write

# (One build per commit: a re-run CI doesn't start a second.)
concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.sha }}

env:
  ODIN_RELEASE: dev-2026-03
  APP_NAME: Rayzr Editor

jobs:
  version:
    runs-on: ubuntu-22.04
    # (Dev builds: only when CI passed on a push - not a pull request's run.)
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      sha: ${{ steps.v.outputs.sha }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # (the commit count, the tags)
      - id: v
        run: |
          base=$(tr -d ' \n' < VERSION)
          publish=false
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            # A released VERSION would make dev builds sort below it.
            if git rev-parse -q --verify "refs/tags/v$base" > /dev/null; then
              echo "::error::v$base is released: bump VERSION (the next release) for dev builds"
              exit 1
            fi
            v="$base-dev.$(git rev-list --count HEAD)"
            if git rev-parse -q --verify "refs/tags/v$v" > /dev/null; then
              echo "::notice::v$v exists (a re-run): nothing to build"
              v=""
            else
              publish=true
            fi
          else
            case "$GITHUB_REF" in
              refs/tags/v*)
                v="${GITHUB_REF_NAME#v}"; publish=true
                case "$v" in "$base"|"$base"-*) ;; *) echo "::warning::tag $v doesn't match VERSION ($base)" ;; esac ;;
              *) v="${{ inputs.version }}"; [ -n "$v" ] || v="0.0.0-dryrun.${{ github.run_number }}" ;;
            esac
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          case "$v" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          echo "Version: $v ($(git rev-parse --short HEAD))"

  runners:
    name: Runner (${{ matrix.platform }})
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: macos-14, platform: macos }
          - { os: ubuntu-22.04, platform: linux }
          - { os: windows-2022, platform: windows }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - run: git submodule update --init --depth 1 ui odin_editor ldtk
      - uses: laytan/setup-odin@v2
        with:
          release: ${{ env.ODIN_RELEASE }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: scripts/ci/setup_deps.sh
      - run: scripts/build_runners.sh -define:RAYZR_RELEASE=${{ needs.version.outputs.version }}
      # (A tarball: artifacts lose the executable bit.)
      - run: tar -C bin/runners -czf runners-${{ matrix.platform }}.tar.gz ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: runners-${{ matrix.platform }}
          path: runners-${{ matrix.platform }}.tar.gz

  web-runner:
    name: Runner (web)
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - run: git submodule update --init --depth 1 ui odin_editor ldtk
      - uses: laytan/setup-odin@v2
        with:
          release: ${{ env.ODIN_RELEASE }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: mymindstorm/setup-emsdk@v14
      - run: scripts/build_web_runner.sh -define:RAYZR_RELEASE=${{ needs.version.outputs.version }}
      - run: tar -C bin/runners -czf runners-web.tar.gz web
      - uses: actions/upload-artifact@v4
        with:
          name: runners-web
          path: runners-web.tar.gz

  package:
    name: Editor (${{ matrix.platform }})
    needs: [version, runners, web-runner]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: macos-14, platform: macos }
          - { os: ubuntu-22.04, platform: linux }
          - { os: windows-2022, platform: windows }
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # (Secrets can't be tested in a step's `if`: flags.)
      HAS_MACOS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - run: git submodule update --init --depth 1 ui odin_editor ldtk
      - uses: laytan/setup-odin@v2
        with:
          release: ${{ env.ODIN_RELEASE }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: scripts/ci/setup_deps.sh
      - uses: actions/download-artifact@v4
        with:
          pattern: runners-*
          path: runner-archives
          merge-multiple: true
      - name: Every platform's runners
        run: |
          mkdir -p bin/runners
          for a in runner-archives/*.tar.gz; do tar -C bin/runners -xzf "$a"; done
          ls bin/runners
      - run: scripts/ci/fetch_luals.sh
      - run: scripts/package_editor.sh --out dist --version "$VERSION" --name "$APP_NAME"

      - name: Sign and notarize (macOS, with a Developer ID)
        if: runner.os == 'macOS' && env.HAS_MACOS_CERT == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: scripts/ci/sign_macos.sh "dist/$APP_NAME.app"

      - name: Sign (Windows, with a code-signing certificate)
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: scripts/ci/sign_windows.sh dist/rayzr-editor-windows

      - name: Archive
        run: |
          base="rayzr-editor-$VERSION-${{ matrix.platform }}"
          case "${{ matrix.platform }}" in
            macos)   hdiutil create -volname "$APP_NAME" -srcfolder "dist/$APP_NAME.app" -ov -format UDZO "$base.dmg" ;;
            linux)
              tar -C dist -czf "$base.tar.gz" rayzr-editor-linux
              scripts/ci/appimage_editor.sh "$VERSION" dist
              mv "dist/Rayzr_Editor-$VERSION-x86_64.AppImage" "$base-x86_64.AppImage"
              scripts/ci/deb_editor.sh "$VERSION" dist
              mv dist/rayzr-editor_*_amd64.deb "$base-amd64.deb" ;;
            windows) (cd dist && 7z a -bd "../$base.zip" rayzr-editor-windows > /dev/null) ;;
          esac
          ls -la rayzr-editor-*
      - uses: actions/upload-artifact@v4
        with:
          name: editor-${{ matrix.platform }}
          path: rayzr-editor-*

  publish:
    name: GitHub Release
    needs: [version, package]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: editor-*
          path: release
          merge-multiple: true
      - run: (cd release && sha256sum rayzr-editor-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          # (A dev build's tag is made here, on its commit.)
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ needs.version.outputs.sha }}
          name: Rayzr Editor ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          files: release/*
