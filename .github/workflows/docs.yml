# The documentation (published at https://rayzr.app/docs by the website,
# github.com/bcrowe306/rayzr_website; docs/contributing/docs.md):
#   - check: the docs are complete and in step with the code
#     (scripts/docs/check_docs.py; nodes.json freshness is checked in ci.yml,
#     which builds the editor), the exporter's and the R2 publisher's tests;
#   - site (pull requests): the website built and tested with this pull
#     request's docs as the dev version (its link check, end-to-end tests),
#     deployed to a preview URL. Production deploys come from release.yml
#     after every build.
name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/docs/check_docs.py
      - run: python3 scripts/docs/test_export_site.py
      - run: python3 scripts/ci/test_publish_r2.py

  site:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: check
    uses: bcrowe306/rayzr_website/.github/workflows/site.yml@main
    with:
      engine_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      reason: "Docs preview for ${{ github.event.pull_request.html_url || github.sha }}"
    secrets: inherit
